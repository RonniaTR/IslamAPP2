services:
  - type: web
    name: islamapp-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: islamapp
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://islamapp-5942a.web.app,https://islamapp-5942a.firebaseapp.com"
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # ---- iyzico payment (set these in the Render dashboard) ----
      - key: IYZICO_API_KEY
        sync: false
      - key: IYZICO_SECRET_KEY
        sync: false
      # Sandbox: https://sandbox-api.iyzipay.com  |  Production: https://api.iyzipay.com
      - key: IYZICO_BASE_URL
        value: "https://sandbox-api.iyzipay.com"
      # Backend callback iyzico redirects to after payment, e.g. https://<backend>/api/premium/iyzico/callback
      - key: IYZICO_CALLBACK_URL
        sync: false
      # Frontend base URL the callback bounces the user back to, e.g. https://islamapp-5942a.web.app
      - key: FRONTEND_URL
        value: "https://islamapp-5942a.web.app"
      # Set to "true" ONLY for local testing to allow manual /premium/activate
      - key: PAYMENTS_DEV_MODE
        sync: false
      # ---- Google OAuth 2.0 login (set these in the Render dashboard) ----
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match an Authorized redirect URI in Google Cloud Console:
      # https://<your-backend-host>/api/auth/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Cross-site cookie mode. Keep "none" for the firebase+render split; use "lax" only for local http dev.
      - key: COOKIE_SAMESITE
        value: "none"
      - key: PYTHON_VERSION
        value: 3.12.1
