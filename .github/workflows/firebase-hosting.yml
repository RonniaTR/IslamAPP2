name: Deploy to Firebase Hosting

# main'e her push/merge'de VEYA Actions sekmesinden elle tetiklenince
# frontend build edilip Firebase Hosting'e (islamapp-5942a) canlı yayınlanır.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
        run: |
          npm --prefix frontend install --legacy-peer-deps --no-audit --no-fund
          npm --prefix frontend run build

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: islamapp-5942a
          channelId: live
